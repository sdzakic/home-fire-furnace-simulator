<!doctype html>
<html lang="hr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator loženja drvima</title>
<meta name="description" content="Interaktivni simulator pirolitičkog kotla na drva 25 kW s dimnjakom, akumulacijskim spremnikom, radijatorima i podnim grijanjem. Interactive wood gasification boiler simulator.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script>
  try { var th = localStorage.getItem('theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M16 2c5 6 9 10 9 17a9 9 0 0 1-18 0c0-4 2-7 4-9 0 3 1 5 3 6 0-5 0-9 2-14z" fill="var(--accent)"/><path d="M16 15c3 3 4 5 4 8a4 4 0 0 1-8 0c0-3 2-4 4-8z" fill="#ffd27a"/></svg>
    <div>
      <h1 data-i18n="app.title">Simulator loženja drvima</h1>
      <p data-i18n="app.sub"></p>
    </div>
  </div>
  <div class="top-actions">
    <div class="seg" id="lang" role="group" data-i18n-label="app.lang">
      <button type="button" data-lang="hr">HR</button><button type="button" data-lang="en">EN</button>
    </div>
    <button type="button" id="theme" class="icon-btn" data-i18n-title="app.theme" data-i18n-label="app.theme">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor"/><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="stage-grid">
    <div class="scene-col">
      <div class="scene-scroll">
        <div class="scene-wrap">
          <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
          <canvas id="fx"></canvas>
        </div>
      </div>

      <div class="transport">
        <button type="button" id="b-ignite" class="btn primary"></button>
        <button type="button" id="b-add" class="btn" data-i18n="btn.addWood"></button>
        <button type="button" id="b-pause" class="btn"></button>
        <div class="speed">
          <span data-i18n="btn.speed"></span>
          <div class="seg" id="speed" role="group">
            <button type="button" data-speed="1">1×</button><button type="button" data-speed="60">60×</button><button type="button" data-speed="300">300×</button><button type="button" data-speed="1200">1200×</button>
          </div>
        </div>
        <div class="clock"><span data-i18n="btn.time"></span> <b id="clock">0 min</b></div>
        <button type="button" id="b-reset" class="btn ghost" data-i18n="btn.reset"></button>
      </div>

      <div class="card stage-card">
        <div class="stage-now">
          <div class="stage-head"><span class="dot" id="stage-dot"></span><b id="stage-name"></b></div>
          <p id="stage-desc"></p>
        </div>
        <div class="stage-chips" id="stage-chips"></div>
      </div>

      <div class="kpis" id="kpis"></div>
      <div class="grid3">
        <div class="card"><h3 data-i18n="s.power"></h3><div id="ch-power"></div></div>
        <div class="card"><h3 data-i18n="s.temps"></h3><div id="ch-water"></div></div>
        <div class="card"><h3 data-i18n="s.gas"></h3><div id="ch-gas"></div></div>
      </div>
      <div class="grid2">
        <div class="card"><h3 data-i18n="s.balance"></h3><div id="balance"></div></div>
        <div class="card"><h3 data-i18n="s.log"></h3><ol id="log" class="log"></ol></div>
      </div>
    </div>

    <aside class="controls" id="controls"></aside>
  </section>

  <section class="block">
    <h2 data-i18n="s.analysis"></h2>
    <p class="lead" data-i18n="s.analysisSub"></p>
    <div class="grid2">
      <div class="card"><h3 data-i18n="a.moisture"></h3><p class="sub" id="a-moisture-sub"></p><div id="ch-moisture"></div></div>
      <div class="card"><h3 data-i18n="a.chimney"></h3><p class="sub" id="a-chimney-sub"></p><div id="ch-chimney"></div></div>
      <div class="card"><h3 data-i18n="a.water"></h3><p class="sub" id="a-water-sub"></p><div id="tb-water" class="table-wrap"></div></div>
      <div class="card"><h3 data-i18n="a.outdoor"></h3><p class="sub" id="a-outdoor-sub"></p><div id="tb-outdoor" class="table-wrap"></div></div>
    </div>
  </section>

  <section class="block">
    <h2 data-i18n="s.components"></h2>
    <div class="comp-grid" id="components"></div>
  </section>
</main>

<footer><p data-i18n="foot"></p></footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
